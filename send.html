<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Crash LIVE</title>
    <style>
        :root {
            --primary: #28a745;
            --danger: #dc3545;
            --dark: #000000;
            --card: #151515;
            --accent: #ffab00;
        }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: var(--dark); color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }

        /* Header */
        .header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .balance-box { background: #222; padding: 8px 15px; border-radius: 20px; border: 1px solid #333; }
        .balance-box span { color: var(--primary); font-weight: bold; }

        /* Game Display */
        .game-window { 
            width: 100%; max-width: 500px; height: 300px; background: #0a0a0a; 
            border-radius: 15px; position: relative; overflow: hidden; border: 1px solid #222;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #multiplier { font-size: 4rem; font-weight: 900; z-index: 2; transition: color 0.2s; }
        .crashed { color: var(--danger) !important; }
        .flying { color: white; }
        .waiting { color: var(--accent); font-size: 1.5rem !important; }

        canvas { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; }

        /* Controls */
        .bet-area { 
            width: 100%; max-width: 500px; background: var(--card); 
            margin-top: 15px; padding: 20px; border-radius: 15px; border: 1px solid #222;
        }
        input { 
            width: 100%; background: #000; border: 1px solid #333; 
            color: white; padding: 15px; border-radius: 10px; font-size: 1.1rem; margin-bottom: 10px;
        }
        button { 
            width: 100%; padding: 15px; border-radius: 10px; border: none; 
            font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s;
        }
        .btn-bet { background: var(--primary); color: white; }
        .btn-bet.cancel { background: #444; }
        .btn-cashout { background: var(--accent); color: black; display: none; }
        
        .status-msg { margin-top: 10px; font-size: 0.9rem; text-align: center; height: 20px; color: #888; }
        
        .nav { display: flex; gap: 10px; width: 100%; max-width: 500px; margin-top: 20px; }
        .nav-btn { flex: 1; background: #222; color: #ccc; text-align: center; padding: 10px; text-decoration: none; border-radius: 5px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: 800; letter-spacing: 1px;">M-LEDGER CRASH</div>
        <div class="balance-box">Ksh <span id="balance">0.00</span></div>
    </div>

    <div class="game-window">
        <canvas id="graph"></canvas>
        <div id="multiplier" class="waiting">Waiting for Round...</div>
    </div>

    <div class="status-msg" id="msg">Initializing engine...</div>

    <div class="bet-area">
        <input type="number" id="betInput" placeholder="Enter Amount (Min 10)">
        <button id="mainBtn" class="btn-bet">PLACE BET</button>
        <button id="cashBtn" class="btn-cashout">CASHOUT</button>
    </div>

    <div class="nav">
        <a href="deposit.html" class="nav-btn">DEPOSIT</a>
        <a href="withdraw.html" class="nav-btn">WITHDRAW</a>
        <a href="history.html" class="nav-btn">HISTORY</a>
    </div>

<script>
const API = "https://funds-mauve.vercel.app/api";
let user = JSON.parse(localStorage.getItem('mledger_user'));
if (!user) location.href = 'index.html';

// Game Constants
let gameState = "WAITING"; // WAITING, FLYING, CRASHED
let currentMult = 1.00;
let crashAt = 0;
let nextRoundIn = 5;
let myBet = 0;
let hasBetNextRound = false;
let isActuallyInRound = false;

const el = {
    balance: document.getElementById('balance'),
    mult: document.getElementById('multiplier'),
    btn: document.getElementById('mainBtn'),
    cash: document.getElementById('cashBtn'),
    input: document.getElementById('betInput'),
    msg: document.getElementById('msg'),
    canvas: document.getElementById('graph')
};
const ctx = el.canvas.getContext('2d');

function updateUI() {
    el.balance.innerText = user.balance.toLocaleString(undefined, {minimumFractionDigits: 2});
}
updateUI();

// Core Loop
function gameLoop() {
    if (gameState === "WAITING") {
        runWaiting();
    } else if (gameState === "FLYING") {
        runFlying();
    } else if (gameState === "CRASHED") {
        runCrashed();
    }
}

function runWaiting() {
    nextRoundIn -= 0.05;
    el.mult.className = "waiting";
    el.mult.innerText = `Next Round in ${Math.max(0, nextRoundIn).toFixed(1)}s`;
    
    if (nextRoundIn <= 0) {
        startRound();
    }
}

function startRound() {
    gameState = "FLYING";
    currentMult = 1.00;
    // Real Aviator math logic
    const rand = Math.random();
    crashAt = rand < 0.1 ? 1.00 : (1 / (1 - Math.random() + 0.01)).toFixed(2);
    
    if (hasBetNextRound) {
        isActuallyInRound = true;
        hasBetNextRound = false;
        el.cash.style.display = "block";
        el.btn.style.display = "none";
    }
}

function runFlying() {
    currentMult += (currentMult * 0.005); // Speed increases as it goes higher
    el.mult.className = "flying";
    el.mult.innerText = currentMult.toFixed(2) + "x";
    draw(currentMult);

    if (currentMult >= crashAt) {
        gameState = "CRASHED";
        setTimeout(() => {
            gameState = "WAITING";
            nextRoundIn = 5;
            isActuallyInRound = false;
            el.btn.className = "btn-bet";
            el.btn.innerText = "PLACE BET";
            el.btn.style.display = "block";
            el.cash.style.display = "none";
        }, 3000);
    }
}

function runCrashed() {
    el.mult.className = "crashed";
    el.mult.innerText = "FLEW AWAY!";
    if (isActuallyInRound) {
        el.msg.innerText = "You lost Ksh " + myBet;
        isActuallyInRound = false;
        syncBalance();
    }
}

// User Actions
el.btn.addEventListener('click', () => {
    if (hasBetNextRound) {
        user.balance += myBet;
        hasBetNextRound = false;
        myBet = 0;
        el.btn.innerText = "PLACE BET";
        el.btn.classList.remove('cancel');
        updateUI();
        return;
    }

    const val = parseFloat(el.input.value);
    if (val >= 10 && val <= user.balance) {
        myBet = val;
        user.balance -= val;
        hasBetNextRound = true;
        el.btn.innerText = "CANCEL BET";
        el.btn.classList.add('cancel');
        el.msg.innerText = "Bet placed for next round";
        updateUI();
    } else {
        el.msg.innerText = "Check balance or min bet (10)";
    }
});

el.cash.addEventListener('click', async () => {
    if (!isActuallyInRound) return;
    
    const win = myBet * currentMult;
    user.balance += win;
    isActuallyInRound = false;
    
    el.cash.style.display = "none";
    el.msg.innerHTML = `<b style="color:#28a745">Win: Ksh ${win.toFixed(2)}</b>`;
    
    updateUI();
    localStorage.setItem('mledger_user', JSON.stringify(user));
    await syncBalance();
});

async function syncBalance() {
    try {
        await fetch(`${API}/update`, { // Adjust to your actual system update path
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ phone: user.phone, balance: user.balance })
        });
    } catch(e) {}
}

function draw(m) {
    ctx.clearRect(0, 0, el.canvas.width, el.canvas.height);
    ctx.beginPath();
    ctx.strokeStyle = "#28a745";
    ctx.lineWidth = 5;
    ctx.moveTo(0, 150);
    ctx.quadraticCurveTo(m * 10, 150, m * 20, 150 - (m * 5));
    ctx.stroke();
}

// Start Game Engine
setInterval(gameLoop, 50);
</script>
</body>
</html>
