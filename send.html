<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Crash PRO - Dual Stake</title>
    <style>
        :root {
            --primary: #28a745;
            --danger: #ff4757;
            --dark: #000000;
            --card: #1a1a1a;
            --accent: #ffab00;
        }
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--dark); color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }

        .header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; padding: 10px; }
        .bal-pill { background: #222; padding: 8px 15px; border-radius: 20px; color: var(--primary); font-weight: bold; border: 1px solid #444; }

        .display-screen { 
            width: 100%; max-width: 600px; height: 250px; background: radial-gradient(circle, #111 0%, #000 100%);
            border-radius: 15px; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 2px solid #333; overflow: hidden;
        }
        #mult-text { font-size: 4rem; font-weight: 900; z-index: 10; text-shadow: 0 0 20px rgba(255,171,0,0.4); }

        .bet-container { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 600px; margin-top: 15px; 
        }
        .bet-box { background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid #333; }
        input { width: 100%; background: #000; border: 1px solid #444; color: white; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 1.1rem; }
        
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-bet { background: var(--primary); color: white; }
        .btn-cash { background: var(--accent); color: black; display: none; flex-direction: column; }
        .active-bet { background: #444; color: #999; }

        @media (max-width: 500px) { .bet-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight:900;">M-CRASH PRO</div>
        <div class="bal-pill">Ksh <span id="user-bal">0.00</span></div>
    </div>

    <div class="display-screen">
        <div id="game-status" style="position:absolute; top:10px; color:#666; font-size:0.8rem;">READY</div>
        <div id="mult-text" style="color: var(--accent);">WAITING</div>
    </div>

    <div class="bet-container">
        <div class="bet-box" id="panel-1">
            <input type="number" class="bet-amt" placeholder="Amount" value="10">
            <button class="btn-bet" onclick="placeBet(1)">PLACE BET</button>
            <button class="btn-cash" onclick="cashout(1)">
                <small>CASHOUT</small>
                <span class="cash-val">0.00</span>
            </button>
        </div>

        <div class="bet-box" id="panel-2">
            <input type="number" class="bet-amt" placeholder="Amount" value="10">
            <button class="btn-bet" onclick="placeBet(2)">PLACE BET</button>
            <button class="btn-cash" onclick="cashout(2)">
                <small>CASHOUT</small>
                <span class="cash-val">0.00</span>
            </button>
        </div>
    </div>

    <p id="msg" style="color:#666; font-size:0.8rem; margin-top:10px;">Backend Synced: /api/fund</p>

<script>
const sounds = {
    engine: new Audio('https://assets.mixkit.co/active_storage/sfx/2045/2045-preview.mp3'),
    cash: new Audio('https://assets.mixkit.co/active_storage/sfx/2017/2017-preview.mp3'),
    crash: new Audio('https://assets.mixkit.co/active_storage/sfx/2533/2533-preview.mp3')
};
sounds.engine.loop = true;

const FUND_API = "https://funds-mauve.vercel.app/api/fund";
let userData = JSON.parse(localStorage.getItem('mledger_user')) || { balance: 0, phone: "000" };
let gameState = "WAITING";
let multiplier = 1.00;
let crashPoint = 0;
let countdown = 5.0;

let bets = {
    1: { amount: 0, status: "NONE" },
    2: { amount: 0, status: "NONE" }
};

function engine() {
    if (gameState === "WAITING") {
        countdown -= 0.016;
        document.getElementById('mult-text').innerText = countdown.toFixed(1) + "s";
        if (countdown <= 0) startRound();
    } 
    else if (gameState === "FLYING") {
        multiplier += (multiplier * 0.007);
        document.getElementById('mult-text').innerText = multiplier.toFixed(2) + "x";
        
        [1, 2].forEach(id => {
            if (bets[id].status === "FLYING") {
                const p = document.getElementById(`panel-${id}`);
                p.querySelector('.cash-val').innerText = "Ksh " + (bets[id].amount * multiplier).toFixed(2);
            }
        });

        if (multiplier >= crashPoint) doCrash();
    }
    requestAnimationFrame(engine);
}

function startRound() {
    gameState = "FLYING";
    multiplier = 1.00;
    crashPoint = (Math.random() < 0.1) ? 1.00 : (1 + Math.pow(Math.random(), 2) * 12).toFixed(2);
    sounds.engine.play();

    [1, 2].forEach(id => {
        if (bets[id].status === "QUEUED") {
            bets[id].status = "FLYING";
            const p = document.getElementById(`panel-${id}`);
            p.querySelector('.btn-bet').style.display = "none";
            p.querySelector('.btn-cash').style.display = "flex";
        }
    });
}

function doCrash() {
    gameState = "CRASHED";
    sounds.engine.pause();
    sounds.engine.currentTime = 0;
    sounds.crash.play();
    document.getElementById('mult-text').style.color = "var(--danger)";

    setTimeout(() => {
        gameState = "WAITING";
        countdown = 5.0;
        resetPanels();
    }, 3000);
}

// --- UPDATED BACKEND SYNC ---
async function syncTransaction(amt) {
    try {
        const response = await fetch(FUND_API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ 
                phone: userData.phone, 
                amount: amt // Negative for stake, Positive for win
            })
        });
        const data = await response.json();
        if(data.newBalance) {
            userData.balance = data.newBalance;
            updateUI();
            localStorage.setItem('mledger_user', JSON.stringify(userData));
        }
    } catch(e) { console.error("Database sync failed"); }
}

function placeBet(id) {
    const p = document.getElementById(`panel-${id}`);
    const input = p.querySelector('.bet-amt');
    const btn = p.querySelector('.btn-bet');

    if (bets[id].status === "QUEUED") {
        // Cancel: Refund money
        const refund = bets[id].amount;
        bets[id].status = "NONE";
        btn.innerText = "PLACE BET";
        btn.classList.remove('active-bet');
        syncTransaction(refund); // Add back to DB
    } else {
        const amt = parseFloat(input.value);
        if (amt >= 10 && amt <= userData.balance) {
            bets[id] = { amount: amt, status: "QUEUED" };
            btn.innerText = "CANCEL (Ksh " + amt + ")";
            btn.classList.add('active-bet');
            syncTransaction(-amt); // Deduct from DB
        }
    }
}

function cashout(id) {
    if (bets[id].status !== "FLYING") return;
    
    const win = bets[id].amount * multiplier;
    bets[id].status = "NONE";
    
    sounds.cash.play();
    const p = document.getElementById(`panel-${id}`);
    p.querySelector('.btn-cash').style.display = "none";
    p.querySelector('.btn-bet').style.display = "block";
    p.querySelector('.btn-bet').innerText = "SUCCESS";
    
    syncTransaction(win); // Add win to DB
}

function resetPanels() {
    [1, 2].forEach(id => {
        bets[id].status = "NONE";
        const p = document.getElementById(`panel-${id}`);
        p.querySelector('.btn-bet').style.display = "block";
        p.querySelector('.btn-bet').innerText = "PLACE BET";
        p.querySelector('.btn-bet').classList.remove('active-bet');
        p.querySelector('.btn-cash').style.display = "none";
        document.getElementById('mult-text').style.color = "var(--accent)";
    });
}

function updateUI() {
    document.getElementById('user-bal').innerText = userData.balance.toLocaleString(undefined, {minimumFractionDigits: 2});
}

updateUI();
engine();
</script>
</body>
</html>
