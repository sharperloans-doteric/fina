
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Crash - Play & Win</title>
    <style>
        :root {
            --primary: #28a745;
            --danger: #dc3545;
            --dark: #121212;
            --card: #1e1e1e;
            --accent: #ffab00;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--dark); color: white; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        /* Header & Balance */
        .header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .balance-card { background: var(--card); padding: 10px 20px; border-radius: 50px; border: 1px solid #333; }
        .balance-card span { color: var(--primary); font-weight: bold; }

        /* Game Area */
        .game-container { width: 100%; max-width: 500px; background: var(--card); border-radius: 15px; overflow: hidden; position: relative; border: 1px solid #333; }
        #canvas { width: 100%; height: 250px; background: #0a0a0a; display: block; }
        .multiplier-display { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; font-weight: 800; color: white; text-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .multiplier-display.crashed { color: var(--danger); }

        /* Controls */
        .controls { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        input { background: #2a2a2a; border: 1px solid #444; color: white; padding: 12px; border-radius: 8px; font-size: 1rem; width: 100%; }
        button { border: none; border-radius: 8px; padding: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        .btn-play { background: var(--primary); color: white; grid-column: span 2; }
        .btn-play:disabled { background: #444; cursor: not-allowed; }
        .btn-cashout { background: var(--accent); color: black; grid-column: span 2; display: none; }
        
        .nav-actions { margin-top: 20px; display: flex; gap: 10px; width: 100%; max-width: 500px; }
        .btn-nav { flex: 1; background: #333; color: white; text-decoration: none; text-align: center; font-size: 0.9rem; }

        .status-msg { margin-top: 15px; font-size: 0.9rem; text-align: center; min-height: 20px; }
        .error { color: var(--danger); }
        .success { color: var(--primary); }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: bold; font-size: 1.2rem;">M-CRASH</div>
        <div class="balance-card">Balance: <span id="balanceDisplay">Ksh 0.00</span></div>
    </div>

    <div class="game-container">
        <canvas id="canvas"></canvas>
        <div id="multiplier" class="multiplier-display">1.00x</div>
        
        <div class="controls">
            <input type="number" id="betAmount" placeholder="Bet Amount (Ksh)" min="10">
            <button id="playBtn" class="btn-play">BET</button>
            <button id="cashoutBtn" class="btn-cashout">CASHOUT</button>
        </div>
    </div>

    <div class="status-msg" id="statusMsg"></div>

    <div class="nav-actions">
        <button class="btn-nav" onclick="location.href='deposit.html'">Deposit</button>
        <button class="btn-nav" onclick="location.href='withdraw.html'">Withdraw</button>
    </div>

<script>
const SYSTEM_API = "https://funds-mauve.vercel.app/api";
let user = JSON.parse(localStorage.getItem('mledger_user'));

// Redirect if no user session
if (!user) {
    alert("Session expired. Please login.");
    window.location.href = 'index.html';
}

// Game State
let isPlaying = false;
let currentMultiplier = 1.00;
let crashPoint = 0;
let gameInterval;
let betValue = 0;

const elements = {
    balance: document.getElementById('balanceDisplay'),
    multiplier: document.getElementById('multiplier'),
    betInput: document.getElementById('betAmount'),
    playBtn: document.getElementById('playBtn'),
    cashoutBtn: document.getElementById('cashoutBtn'),
    status: document.getElementById('statusMsg'),
    canvas: document.getElementById('canvas')
};

const ctx = elements.canvas.getContext('2d');

// Initialize View
function updateBalanceUI() {
    elements.balance.innerText = `Ksh ${user.balance.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
}
updateBalanceUI();

// Game Engine
function startRunning() {
    isPlaying = true;
    currentMultiplier = 1.00;
    // House edge math: Higher multipliers are rarer
    crashPoint = (Math.random() * 10 > 1) ? (1 + Math.random() * 4).toFixed(2) : (1 + Math.random() * 1).toFixed(2);
    
    elements.playBtn.style.display = 'none';
    elements.cashoutBtn.style.display = 'block';
    elements.multiplier.classList.remove('crashed');
    elements.status.innerText = "Rocket is flying...";

    gameInterval = setInterval(() => {
        currentMultiplier += 0.01;
        elements.multiplier.innerText = currentMultiplier.toFixed(2) + 'x';
        drawGraph(currentMultiplier);

        if (currentMultiplier >= crashPoint) {
            crashGame();
        }
    }, 100);
}

function crashGame() {
    clearInterval(gameInterval);
    isPlaying = false;
    elements.multiplier.innerText = "CRASHED @ " + currentMultiplier.toFixed(2) + 'x';
    elements.multiplier.classList.add('crashed');
    elements.playBtn.style.display = 'block';
    elements.cashoutBtn.style.display = 'none';
    elements.status.innerHTML = `<span class="error">Crashed! You lost Ksh ${betValue}</span>`;
    
    // Update backend with loss
    updateBackendBalance(user.balance); 
}

async function cashout() {
    if (!isPlaying) return;
    isPlaying = false;
    clearInterval(gameInterval);

    const winAmount = betValue * currentMultiplier;
    user.balance += winAmount;
    
    elements.playBtn.style.display = 'block';
    elements.cashoutBtn.style.display = 'none';
    elements.status.innerHTML = `<span class="success">Win! +Ksh ${winAmount.toFixed(2)}</span>`;
    
    updateBalanceUI();
    await updateBackendBalance(user.balance);
    localStorage.setItem('mledger_user', JSON.stringify(user));
}

async function updateBackendBalance(newBalance) {
    try {
        await fetch(`${SYSTEM_API}/update-balance`, { // Hypothetical endpoint based on your request
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                phone: user.phone,
                balance: newBalance
            })
        });
    } catch (e) { console.error("Sync failed"); }
}

function drawGraph(mult) {
    ctx.clearRect(0, 0, elements.canvas.width, elements.canvas.height);
    ctx.beginPath();
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = '#333';
    ctx.moveTo(0, 250);
    ctx.lineTo(300, 0);
    ctx.stroke();
    
    ctx.beginPath();
    ctx.setLineDash([]);
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#28a745';
    ctx.moveTo(0, 250);
    // Dynamic curve based on multiplier
    ctx.quadraticCurveTo(mult * 20, 250, mult * 50, 250 - (mult * 20));
    ctx.stroke();
}

elements.playBtn.addEventListener('click', () => {
    betValue = parseFloat(elements.betInput.value);
    
    if (isNaN(betValue) || betValue < 10) {
        elements.status.innerText = "Minimum bet is Ksh 10";
        return;
    }

    if (betValue > user.balance) {
        elements.status.innerHTML = `<span class="error">Insufficient funds! Top up your account.</span>`;
        return;
    }

    // Deduct bet immediately
    user.balance -= betValue;
    updateBalanceUI();
    localStorage.setItem('mledger_user', JSON.stringify(user));
    startRunning();
});

elements.cashoutBtn.addEventListener('click', cashout);

// Initial Canvas Draw
drawGraph(1);
</script>
</body>
</html>
