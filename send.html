
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Crash - LIVE SYNC</title>
    <style>
        :root { --primary: #28a745; --danger: #ff4757; --dark: #000; --card: #111; --accent: #ffab00; }
        * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: var(--dark); color: white; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; max-width: 450px; display: flex; justify-content: space-between; align-items: center; padding: 15px 5px; }
        .bal-pill { background: #1a1a1a; padding: 8px 15px; border-radius: 20px; border: 1px solid #333; font-weight: 700; color: var(--primary); }
        .screen { width: 100%; max-width: 450px; height: 250px; background: #050505; border-radius: 15px; border: 1px solid #222; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        #multiplier { font-size: 3.5rem; font-weight: 900; }
        .bet-box { width: 100%; max-width: 450px; background: var(--card); margin-top: 15px; padding: 20px; border-radius: 15px; border: 1px solid #222; }
        input { width: 100%; background: #000; border: 1px solid #333; color: white; padding: 15px; border-radius: 10px; font-size: 1.2rem; margin-bottom: 10px; outline: none; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: 800; font-size: 1.1rem; cursor: pointer; }
        .btn-bet { background: var(--primary); color: white; }
        .btn-cash { background: var(--accent); color: black; display: none; flex-direction: column; }
        .msg { margin-top: 10px; font-size: 0.8rem; color: #666; height: 20px; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-weight: 900;">M-CRASH</div>
        <div class="bal-pill">Ksh <span id="user-bal">0.00</span></div>
    </div>

    <div class="screen">
        <div id="multiplier" style="color: var(--accent);">Waiting...</div>
        <div id="status" style="position:absolute; top:10px; font-size:0.7rem; color:#444; text-transform:uppercase;">Engine Ready</div>
    </div>

    <div class="msg" id="msg">Connect to play</div>

    <div class="bet-box">
        <input type="number" id="bet-amt" placeholder="Bet Amount">
        <button id="bet-btn" class="btn-bet">PLACE BET</button>
        <button id="cash-btn" class="btn-cash">
            <small style="font-size: 0.6rem;">CASHOUT</small>
            <span id="cash-val">Ksh 0.00</span>
        </button>
    </div>

<script>
// --- CONFIGURATION ---
const SYSTEM_API = "https://aviot.vercel.app/api"; // Your Vercel URL
let user = JSON.parse(localStorage.getItem('mledger_user'));

if (!user) { location.href = 'index.html'; }

// --- GAME STATE ---
let gameState = "WAITING"; 
let mult = 1.00;
let crashPoint = 0;
let timer = 5.0;
let myBet = 0;
let inRound = false;
let queued = false;

const dom = {
    bal: document.getElementById('user-bal'),
    mult: document.getElementById('multiplier'),
    betBtn: document.getElementById('bet-btn'),
    cashBtn: document.getElementById('cash-btn'),
    cashVal: document.getElementById('cash-val'),
    input: document.getElementById('bet-amt'),
    msg: document.getElementById('msg')
};

function refreshUI() {
    dom.bal.innerText = Number(user.balance).toLocaleString();
    localStorage.setItem('mledger_user', JSON.stringify(user));
}
refreshUI();

// --- BACKEND SYNC ---
async function sync(amountChange) {
    try {
        const res = await fetch(`${SYSTEM_API}/fund`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone: user.phone, amount: amountChange })
        });
        const data = await res.json();
        if (data.success) {
            user.balance = data.newBalance; // Update local to match Supabase
            refreshUI();
        }
    } catch (e) { console.error("Sync Error"); }
}

// --- ENGINE ---
function loop() {
    if (gameState === "WAITING") {
        timer -= 0.016;
        dom.mult.innerText = timer.toFixed(1) + "s";
        dom.mult.style.color = "var(--accent)";
        if (timer <= 0) start();
    } else if (gameState === "FLYING") {
        mult += (mult * 0.007);
        dom.mult.innerText = mult.toFixed(2) + "x";
        dom.mult.style.color = "white";
        if (inRound) {
            dom.cashVal.innerText = "Ksh " + (myBet * mult).toFixed(2);
        }
        if (mult >= crashPoint) crash();
    }
    requestAnimationFrame(loop);
}

function start() {
    gameState = "FLYING";
    mult = 1.00;
    crashPoint = (Math.random() < 0.1) ? 1.00 : (1 + Math.random() * 4).toFixed(2);
    if (queued) {
        inRound = true;
        queued = false;
        dom.betBtn.style.display = "none";
        dom.cashBtn.style.display = "flex";
    }
}

function crash() {
    gameState = "CRASHED";
    dom.mult.style.color = "var(--danger)";
    if (inRound) {
        dom.msg.innerText = "Lost Ksh " + myBet;
        inRound = false;
        // No need to sync on crash because we already deducted the money at bet time
    }
    setTimeout(() => {
        gameState = "WAITING";
        timer = 5.0;
        dom.betBtn.style.display = "block";
        dom.betBtn.innerText = "PLACE BET";
        dom.cashBtn.style.display = "none";
        dom.msg.innerText = "Next round ready";
    }, 2500);
}

// --- ACTIONS ---
dom.betBtn.addEventListener('click', () => {
    if (queued) {
        sync(myBet); // Refund
        queued = false;
        dom.betBtn.innerText = "PLACE BET";
        return;
    }
    const amt = parseFloat(dom.input.value);
    if (amt >= 10 && amt <= user.balance) {
        myBet = amt;
        sync(-amt); // DEDUCT FROM SUPABASE IMMEDIATELY
        queued = true;
        dom.betBtn.innerText = "CANCEL (" + amt + ")";
    } else {
        dom.msg.innerText = "Insufficient balance or invalid amount";
    }
});

dom.cashBtn.addEventListener('click', () => {
    if (!inRound) return;
    const winnings = myBet * mult;
    sync(winnings); // ADD WINNINGS TO SUPABASE
    inRound = false;
    dom.cashBtn.style.display = "none";
    dom.betBtn.style.display = "block";
    dom.betBtn.innerText = "WAITING...";
    dom.msg.innerText = "WIN! +Ksh " + winnings.toFixed(2);
});

loop();
</script>
</body>
</html>
