<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduled Maintenance</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f4f4f7; 
            color: #333; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            text-align: center; 
            background: white; 
            padding: 3rem; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        h1 { color: #d9534f; margin-top: 0; }
        p { line-height: 1.6; }
        .date { font-weight: bold; color: #555; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Under Maintenance</h1>
        <p>We're currently performing some scheduled updates to improve our service.</p>
        <p>Everything should be back to normal by:</p>
        <p class="date">19 March, 00:00 hrs</p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <p style="font-size: 0.9rem; color: #888;">Thank you for your patience!</p>
    </div>

</body>
</html>
